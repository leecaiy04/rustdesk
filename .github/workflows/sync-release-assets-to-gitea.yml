name: Sync GitHub releases to Gitea
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Release tag to sync
        required: true
        default: custom-20261110
permissions:
  contents: read
jobs:
  sync-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Sync releases and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          api='https://git.222869.xyz:45443/api/v1'
          owner='leecaiy'
          repo='rustdesk'
          if [ "${{ github.event_name }}" = "release" ]; then
            tag='${{ github.event.release.tag_name }}'
          else
            tag='${{ inputs.release-tag }}'
          fi
          repo_meta=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ github.repository }}")
          description=$(jq -r '.description // ""' <<<"$repo_meta")
          homepage=$(jq -r '.homepage // ""' <<<"$repo_meta")
          default_branch=$(jq -r '.default_branch // "master"' <<<"$repo_meta")
          metadata=$(jq -n --arg description "$description" --arg homepage "$homepage" --arg default_branch "$default_branch" '{description:$description,website:$homepage,default_branch:$default_branch}')
          curl -fsSL -X PATCH -H "Authorization: token ${GITEA_TOKEN}" -H 'Content-Type: application/json' "$api/repos/$owner/$repo" -d "$metadata" >/dev/null || true
          release=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag")
          if [ "$(jq -r '.draft' <<<"$release")" != 'false' ]; then
            echo "Release $tag is still a draft"
            exit 1
          fi
          name=$(jq -r '.name // .tag_name' <<<"$release")
          body=$(jq -r '.body // ""' <<<"$release")
          existing=$(curl -fsSL -H "Authorization: token ${GITEA_TOKEN}" "$api/repos/$owner/$repo/releases/tags/$tag" || true)
          if [ -z "$existing" ] || [ "$existing" = 'null' ]; then
            payload=$(jq -n --arg tag "$tag" --arg name "$name" --arg body "$body" '{tag_name:$tag,target_commitish:"master",name:$name,body:$body,draft:false,prerelease:false}')
            existing=$(curl -fsSL -X POST -H "Authorization: token ${GITEA_TOKEN}" -H 'Content-Type: application/json' "$api/repos/$owner/$repo/releases" -d "$payload")
          fi
          rid=$(jq -r '.id' <<<"$existing")
          existing_assets=$(curl -fsSL -H "Authorization: token ${GITEA_TOKEN}" "$api/repos/$owner/$repo/releases/$rid/assets")
          jq -r --argjson existing "$existing_assets" '.assets[] | select(.name as $n | $existing | any(.name == $n) | not) | [.name,.browser_download_url,.digest] | @tsv' <<<"$release" > pending-assets.tsv
          if [ ! -s pending-assets.tsv ]; then
            echo "All assets for $tag are already present"
            exit 0
          fi
          xargs -P 3 -n 3 bash -c '
            set -euo pipefail
            name="$1"; url="$2"; digest="$3"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 30 --max-time 1800 "$url" -o "$name"
            expected="${digest#sha256:}"
            actual=$(sha256sum "$name" | cut -d" " -f1)
            test "$actual" = "$expected"
            echo "Verified $name"
          ' _ < pending-assets.tsv
          xargs -P 3 -n 3 bash -c '
            set -euo pipefail
            name="$1"
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 30 --max-time 1800 \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -F "attachment=@${name}" \
              "'"$api"'/repos/'"$owner"'/'"$repo"'/releases/'"$rid"'/assets?name=${name}" >/dev/null
            echo "Uploaded $name"
          ' _ < pending-assets.tsv
