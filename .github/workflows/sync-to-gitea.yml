name: Sync to Gitea
on:
  push:
    branches: [master]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Push master and release tags
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git remote add gitea "https://leecaiy:${GITEA_TOKEN}@git.222869.xyz:45443/leecaiy/rustdesk.git"
          git push --force gitea HEAD:refs/heads/master
