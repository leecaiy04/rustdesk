name: Sync to Gitea
on:
  push:
    branches: [master]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Push master and release tags
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          status=$(curl -sS --connect-timeout 10 --max-time 20 -H "Authorization: token ${GITEA_TOKEN}" \
            -o forgejo-response.txt -w '%{http_code}' \
            https://git.222869.xyz:45443/api/v1/user)
          echo "Forgejo API HTTP $status"
          if [ "$status" != 200 ]; then
            head -c 500 forgejo-response.txt
            exit 1
          fi
          git remote add gitea "https://leecaiy:${GITEA_TOKEN}@git.222869.xyz:45443/leecaiy/rustdesk.git"
          timeout 900 git push --force gitea HEAD:refs/heads/master
